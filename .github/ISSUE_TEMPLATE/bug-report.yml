name: Bug report (English)
description: Report a reproducible launcher or DSH WebUI plugin problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the Preview. Remove personal paths and secrets from logs before attaching them.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - macOS launcher
        - DSH WebUI plugin
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: WhaleConsole, DSH, macOS, Node.js, and pnpm versions.
      placeholder: WhaleConsole 0.2.1-preview.1; DSH 0.1.1-rc.2; macOS 15; Node.js 24
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, usernames, home-directory paths, and other private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and personal information from the report.
          required: true
