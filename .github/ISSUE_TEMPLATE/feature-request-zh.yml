name: 功能建议（简体中文）
description: 提议范围明确的启动器、插件或皮肤系统改进。
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: surface
    attributes:
      label: 目标部分
      options:
        - macOS 启动器
        - DSH WebUI 插件
        - 共用皮肤系统
        - 文档或发布流程
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述用户需求，再描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的功能表现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 项目边界
      options:
        - label: 该功能可通过 DSH 增量扩展点实现，不需要替换 WebUI 核心界面。
          required: true
        - label: 建议使用的美术素材为原创内容，并具有明确许可证。
          required: true
