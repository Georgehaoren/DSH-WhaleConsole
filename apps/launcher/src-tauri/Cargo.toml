[package]
name = "dsh-whale-console-launcher"
version = "0.2.1-preview.1"
description = "Unofficial macOS launcher for DSH WebUI"
authors = ["DSH WhaleConsole contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_whale_console_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.1", features = ["tray-icon"] }
